name: Cloudflare diagnose

on:
  push:
    branches:
      - sprint-1-v6-core
    paths:
      - '.github/workflows/cloudflare-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout Sprint 1 v6
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Static checks
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Wrangler dry run
        run: pnpm build

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured in GitHub Actions secrets.'
            exit 2
          fi
          echo 'Cloudflare API token is present.'
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID is not configured; Wrangler will attempt account discovery.'
          else
            echo 'Cloudflare account ID is present.'
          fi

      - name: Wrangler identity
        run: pnpm exec wrangler whoami

      - name: Remote D1 migration status
        run: pnpm exec wrangler d1 migrations list photown-db --remote
